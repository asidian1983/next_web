name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ────────────────────────────────────────────
  # Build & push all Docker images
  # ────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/textile-ai/web:latest
            ${{ secrets.REGISTRY_URL }}/textile-ai/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/textile-ai/api:latest
            ${{ secrets.REGISTRY_URL }}/textile-ai/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ai image
        uses: docker/build-push-action@v5
        with:
          context: apps/ai
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/textile-ai/ai:latest
            ${{ secrets.REGISTRY_URL }}/textile-ai/ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────
  # Deploy to Kubernetes via kustomize
  # ────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update image tags in kustomize
        run: |
          cd k8s
          kustomize edit set image \
            textile-ai/web=${{ secrets.REGISTRY_URL }}/textile-ai/web:${{ github.sha }} \
            textile-ai/api=${{ secrets.REGISTRY_URL }}/textile-ai/api:${{ github.sha }} \
            textile-ai/ai=${{ secrets.REGISTRY_URL }}/textile-ai/ai:${{ github.sha }}

      - name: Apply manifests (kustomize)
        run: kubectl apply -k k8s/

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/web -n textile-ai --timeout=300s
          kubectl rollout status deployment/api -n textile-ai --timeout=300s
          kubectl rollout status deployment/ai -n textile-ai --timeout=300s

      - name: Health check
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/part-of=textile-ai-platform \
            -n textile-ai \
            --timeout=300s
          kubectl get deployments -n textile-ai
