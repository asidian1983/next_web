name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ────────────────────────────────────────────
  # Web (Next.js)
  # ────────────────────────────────────────────
  web:
    name: Web — Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json   # root lockfile

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  # ────────────────────────────────────────────
  # API (NestJS)
  # ────────────────────────────────────────────
  api:
    name: API — Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json   # root lockfile

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ────────────────────────────────────────────
  # AI (FastAPI / Python)
  # ────────────────────────────────────────────
  ai:
    name: AI — Lint & Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/ai/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py routers/*.py services/*.py models/*.py

  # ────────────────────────────────────────────
  # Docker build smoke test (no push)
  # ────────────────────────────────────────────
  docker:
    name: Docker — Build Test
    runs-on: ubuntu-latest
    needs: [web, api, ai]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build api image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ai image
        uses: docker/build-push-action@v5
        with:
          context: apps/ai
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
